name: ddareungi_app
description: "따릉이 대여소 시간대별 공백률·대체 대여소 조회 앱"
publish_to: 'none'

version: 1.0.0+1

# 다른 PC도 같은 버전으로 설치: Flutter 3.47.7 (Dart 3.13.5)
environment:
  sdk: ^3.13.5
  flutter: 3.47.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: 1.0.8  # Flutter 기본 위젯이 찾는 아이콘 글꼴
  fl_chart: 1.2.0         # 시간대별 공백률 막대그래프

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # build_metrics.py가 만든 집계 결과 (서버 없이 앱에 포함)
  assets:
    - assets/stations.json
    - assets/empty_rate.json
    - assets/diagnosis.json
  # 한글 글꼴 앱 포함: 인터넷 없이도 한글 표시 (Pretendard 1.3.9, SIL OFL, fonts/LICENSE.txt)
  fonts:
    - family: Pretendard
      fonts:
        - asset: fonts/Pretendard-Regular.otf
        - asset: fonts/Pretendard-Bold.otf
          weight: 700
